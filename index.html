<!DOCTYPE html>
<html>
<head>
  <title>For Vachu ❤️</title>
  <style>
    body {
      background: linear-gradient(to right, #ff758c, #ff7eb3);
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
      padding-top: 15%;
      overflow: hidden;
    }

    h1 {
      font-size: 45px;
      margin-bottom: 20px;
    }

    p {
      font-size: 22px;
      margin: 10px;
    }

    .heart {
      position: fixed;
      bottom: -10px;
      font-size: 20px;
      animation: floatUp 5s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <h1>💖 Happy Valentine's Day Vachu 💖</h1>

  <p>You hacked my heart permanently ❤️</p>
  <p>Sorry for everything 🤍</p>
  <p>Best wishes for your life 💫</p>

  <script>
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 300);
  </script>

</body>
</html>
